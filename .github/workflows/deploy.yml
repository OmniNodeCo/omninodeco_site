# ============================================================
# Deploy website → FTP (via GitHub Secrets)
# ------------------------------------------------------------
# Runs on every push to `main` (and manually via "Run workflow").
#
# Required repository secrets:
#
#   FTP_SERVER       e.g. ftp.example.com
#   FTP_USERNAME     your FTP login
#   FTP_PASSWORD     your FTP password
#   FTP_PORT         default 21
#   FTP_SERVER_DIR   remote folder to publish into, e.g. /public_html
#
# Optional secret:
#
#   WEBSITE_URL      production URL for the post-deploy smoke test,
#                    e.g. https://www.example.com
#
# Protocol options:
#   ftp | ftps | ftps-legacy | sftp
# ============================================================

name: Deploy website to FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time: a new push cancels any in-flight upload.
concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish site via FTP
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      # 1. Check out the repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Optional build step
      # Uncomment and customize if the site needs a build:
      #
      # - name: Build site
      #   run: |
      #     npm ci
      #     npm run build

      # 3. Sync the site to the FTP server
      - name: 📂 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 60000
          dangerous-clean-slow: true
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.vscode/**
            **/.idea/**
            README.md
            **/.DS_Store
            **/Thumbs.db
            **/*.log

      # 4. Smoke test production
      #
      # The `secrets` context cannot be used directly in an `if:`
      # expression. Pass the secret through an environment variable.
      - name: 🌐 Smoke test production
        env:
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
        if: env.WEBSITE_URL != ''
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --output /dev/null \
            --max-time 30 \
            "$WEBSITE_URL"

          echo "✅ Production smoke test passed."

      # 5. Summary
      #
      # Secrets are exposed to the shell only through environment
      # variables. Passwords are never included in the summary.
      - name: 📝 Deploy summary
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
        run: |
          echo "### 🚀 Deploy finished" >> "$GITHUB_STEP_SUMMARY"

          echo "- 📂 Uploaded to: \`$FTP_SERVER\` → \`$FTP_SERVER_DIR\`" \
            >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$WEBSITE_URL" ]; then
            echo "- 🌐 Website: $WEBSITE_URL" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 🌐 Website: Not configured" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
