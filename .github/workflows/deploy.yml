# ============================================================
# Deploy website → FTP (via GitHub Secrets)
# ------------------------------------------------------------
# Runs on every push to `main` (and manually via "Run workflow").
#
# Required repository secrets (Settings → Secrets and variables
# → Actions → New repository secret):
#
#   FTP_SERVER       e.g.  ftp.example.com   (no scheme, no path)
#   FTP_USERNAME     your FTP login
#   FTP_PASSWORD     your FTP password
#   FTP_PORT         default 21  (22 for SFTP, 990 for FTPS)
#   FTP_SERVER_DIR   remote folder to publish into, e.g. /public_html
#
# Optional secrets:
#   WEBSITE_URL      production URL for the post-deploy smoke test,
#                    e.g. https://www.example.com
#
# For explicit FTP (plain), implicit FTPS or SFTP, change the
# `protocol` input below: ftp | ftps | ftps-legacy | sftp
# ============================================================

name: Deploy website to FTP

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual deploys from the Actions tab

permissions:
  contents: read # only need to check out the repo — no write scopes

# One deploy at a time: a new push cancels any in-flight upload.
concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish site via FTP
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      # 1. Check out the repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. (Optional) build step — insert your build here if the
      #    site ever grows a bundler, e.g.
      #      - name: Build site
      #        run: npm ci && npm run build
      #    (Point the FTP action at the build output via FTP_SERVER_DIR.)

      # 3. Sync the site to the FTP server using encrypted secrets.
      #    Nothing sensitive is stored in this file.
      - name: 📂 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 60000
          dangerous-clean-slow: true # mirror the repo: delete remote files not in it.
                                    # Set to false if FTP_SERVER_DIR contains other
                                    # content you must keep.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.vscode/**
            **/.idea/**
            README.md
            **/.DS_Store
            **/Thumbs.db
            **/*.log

      # 4. Smoke test: confirm the production URL answers 200.
      #    The publish target lives in the WEBSITE_URL secret.
      - name: 🌐 Smoke test production
        if: ${{ secrets.WEBSITE_URL != '' }}
        run: curl --fail --silent --show-error --output /dev/null --max-time 30 "${{ secrets.WEBSITE_URL }}"

      # 5. Summary: show the site we published to.
      - name: 📝 Deploy summary
        if: always()
        run: |
          echo "### 🚀 Deploy finished" >> "$GITHUB_STEP_SUMMARY"
          echo "- 📂 Uploaded to: \`${{ secrets.FTP_SERVER }}\` → \`${{ secrets.FTP_SERVER_DIR }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 🌐 Website: ${{ secrets.WEBSITE_URL }}" >> "$GITHUB_STEP_SUMMARY"
