# ============================================================
# Deploy website → FTP (via GitHub Secrets)
# ------------------------------------------------------------
# Runs on every push to `main` (and manually via "Run workflow").
#
# Required repository secrets:
#
#   FTP_SERVER       e.g. ftp.example.com
#   FTP_USERNAME     your FTP login
#   FTP_PASSWORD     your FTP password
#   FTP_PORT         default 21
#   FTP_SERVER_DIR   remote folder, e.g. /public_html
#
# Optional secret:
#
#   WEBSITE_URL      production URL for the post-deploy smoke test
#                    e.g. https://omninodeco.liveblog365.com/
#
# Protocol options:
#   ftp | ftps | ftps-legacy | sftp
# ============================================================

name: Deploy website to FTP

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time.
concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish site via FTP
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    # Make the optional website URL available to all steps.
    env:
      WEBSITE_URL: ${{ secrets.WEBSITE_URL }}

    steps:

      # --------------------------------------------------------
      # 1. Check out the repository
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Deploy website via FTP
      # --------------------------------------------------------
      - name: 📂 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 60000

          # Mirror the repository:
          # delete remote files that are not present locally.
          dangerous-clean-slow: true

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.vscode/**
            **/.idea/**
            README.md
            **/.DS_Store
            **/Thumbs.db
            **/*.log

      # --------------------------------------------------------
      # 3. Smoke test production website
      # --------------------------------------------------------
      - name: 🌐 Smoke test production
        if: ${{ env.WEBSITE_URL != '' }}
        continue-on-error: true
        run: |
          echo "Testing $WEBSITE_URL"

          HTTP_CODE=$(curl \
            --location \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --connect-timeout 10 \
            --max-time 30 \
            "$WEBSITE_URL" || true)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Website responded with HTTP 200."

          elif [ "$HTTP_CODE" = "301" ] || \
               [ "$HTTP_CODE" = "302" ] || \
               [ "$HTTP_CODE" = "303" ] || \
               [ "$HTTP_CODE" = "307" ] || \
               [ "$HTTP_CODE" = "308" ]; then
            echo "✅ Website responded with HTTP $HTTP_CODE (redirect)."

          elif [ -z "$HTTP_CODE" ] || [ "$HTTP_CODE" = "000" ]; then
            echo "⚠️ Website did not return an HTTP response."

          else
            echo "⚠️ Website responded with HTTP $HTTP_CODE."
          fi

      # --------------------------------------------------------
      # 4. Deployment summary
      # --------------------------------------------------------
      - name: 📝 Deploy summary
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          echo "### 🚀 Deploy finished" >> "$GITHUB_STEP_SUMMARY"

          echo "- 📂 Uploaded to: \`$FTP_SERVER\` → \`$FTP_SERVER_DIR\`" \
            >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$WEBSITE_URL" ]; then
            echo "- 🌐 Website: $WEBSITE_URL" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 🌐 Website: Not configured" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
